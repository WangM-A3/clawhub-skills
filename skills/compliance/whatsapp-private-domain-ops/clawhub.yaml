name: whatsapp-private-domain-ops
title: WhatsApp全域私域运营技能（合规适配版）
description: |
  Meta合规框架内的WhatsApp私域资产高效运营体系。
  
  **核心方法论**：三层合规自适应运营——根据账号质量评分实时调节运营强度。
  
  **功能覆盖**：
  - 账号基建与合规底层设计
  - 五层用户标签体系与全生命周期运营
  - 三层合规自适应运营体系（平台规则适配/运营节奏优化/自适应质量管理）
  - AI拟人化运营建议
  - 数据观察与标准化迭代流程
  - 合规自检与应急响应预案
  
  **适用场景**：跨境电商、出海营销、SCRM运营
  
  **安全声明**：纯策略规划工具，不连接WhatsApp API，不自动发送消息。
