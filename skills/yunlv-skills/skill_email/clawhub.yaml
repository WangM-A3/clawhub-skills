description: Use when user needs to write professional business emails in multiple
  languages. Use when drafting foreign trade emails such as inquiry replies, quotation
  emails, or follow-up messages. Use when generating personalized B2B email sequences
  for international clients. Use when user mentions "邮件撰写", "外贸邮件", "多语言邮件", "开发信",
  "询盘回复", "报价邮件", "跟进邮件", "商务邮件".
